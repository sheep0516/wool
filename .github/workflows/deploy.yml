name: Deploy to GitHub Pages

# 什么时候跑：推送到 main、或在 Actions 页面手动点一下
on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许把构建结果发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布；排队中的旧任务直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 内容体检（有问题就让构建失败，避免发出坏页面）
        run: npm run check

      - name: 静态导出
        # 仓库名就是访问子路径：https://<用户名>.github.io/wool/
        # 如果以后改了仓库名，这里跟着改。
        run: node tools/build-static.js --base /wool

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
