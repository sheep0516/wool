name: Deploy to GitHub Pages

# 什么时候跑：推送到 main、或在 Actions 页面手动点一下
on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许把构建结果发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布；排队中的旧任务直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 内容体检（有问题就让构建失败，避免发出坏页面）
        run: npm run check

      # 先问 GitHub「这个站点实际服务在哪个路径」，再据此导出。
      #   配了自定义域名（如 https://example.com/） → base_path 是空串
      #   默认项目页（https://<用户名>.github.io/wool/） → base_path 是 /wool
      # ⚠️ 这里写死任何一个，都会在另一种情况下让全站资源 404（页面只剩裸 HTML）。
      #    所以必须让 configure-pages 先跑，把答案传下去。
      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 静态导出
        run: node tools/build-static.js --base "${{ steps.pages.outputs.base_path }}"

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
